<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@potrepka/native-audio HTML Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      #buttons {
        margin-top: 20px;
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
      }
      #output {
        margin-top: 20px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 5px;
        white-space: pre-wrap;
        font-family: monospace;
      }
      .status {
        margin: 10px 0;
        padding: 10px;
        border-radius: 5px;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
    </style>
  </head>
  <body>
    <h1>@potrepka/native-audio HTML Demo</h1>

    <div id="status" class="status info">Loading WASM module...</div>

    <div id="buttons">
      <button id="btnTest" disabled>Run Test</button>
      <button id="btnPlay" disabled>Start Engine & Play</button>
    </div>

    <div id="output"></div>

    <script>
      const statusDiv = document.getElementById('status')
      const outputDiv = document.getElementById('output')
      const btnTest = document.getElementById('btnTest')
      const btnPlay = document.getElementById('btnPlay')

      let audioContext
      let audioWorkletNode
      let isPlaying = false

      function log(message) {
        outputDiv.textContent += message + '\n'
      }

      function updateStatus(message, className) {
        statusDiv.textContent = message
        statusDiv.className = `status ${className}`
      }

      function arrayBufferToHex(buffer) {
        const bytes = new Uint8Array(buffer)
        const hexParts = new Array(bytes.length)
        for (let i = 0; i < bytes.length; i++) {
          hexParts[i] = bytes[i].toString(16).padStart(2, '0')
        }
        return hexParts.join('')
      }

      function buildWorkletCode(wasmHex, wasmLoaderCode, workletProcessorCode) {
        if (!wasmHex) throw new Error('WASM hex string is empty')
        if (!wasmLoaderCode) throw new Error('WASM loader code is empty')
        if (!workletProcessorCode)
          throw new Error('Worklet processor code is empty')
        return `
// ============================================================================
// WASM Binary Loader
// Hex-encoded WASM binary injected at worklet module load time.
// This approach is required because AudioWorkletGlobalScope prevents fetch().
// ============================================================================

(function initPreloadedWasm() {
  const wasmHex = '${wasmHex}';
  const wasmBytes = new Uint8Array(wasmHex.length / 2);

  for (let i = 0; i < wasmHex.length; i += 2) {
    wasmBytes[i / 2] = parseInt(wasmHex.substr(i, 2), 16);
  }

  globalThis.preloadedWasmBinary = wasmBytes.buffer;
})();

// ============================================================================
// Emscripten WASM Loader
// ============================================================================

${wasmLoaderCode}

// ============================================================================
// AudioWorklet Processor
// ============================================================================

${workletProcessorCode}
`
      }

      /**
       * Creates a blob URL for an AudioWorklet module with pre-loaded WASM binary.
       *
       * AudioWorklet scope restrictions prevent normal WASM loading:
       * - No fetch() or XMLHttpRequest (no network access)
       * - No importScripts() (no dynamic script loading)
       * - No atob() in some browsers (no Base64 decoding)
       *
       * This helper hex-encodes the WASM binary in the main thread and injects it
       * into the worklet scope, where it's decoded back to an ArrayBuffer.
       *
       * Hex encoding is used because it:
       * - Works in all AudioWorklet environments (no dependencies)
       * - Is simple to decode with basic JavaScript
       * - Is debuggable (can inspect hex string)
       * - Has acceptable 2x size expansion (360KB → 720KB)
       *
       * @param {string} wasmUrl - URL to WASM binary file
       * @param {string} wasmLoaderUrl - URL to Emscripten loader JS file
       * @param {string} workletUrl - URL to AudioWorklet processor JS file
       * @param {Function} [onProgress] - Optional progress callback
       * @returns {Promise<string>} Blob URL containing complete worklet code
       */
      async function createAudioWorkletBlobWithWasm(
        wasmUrl,
        wasmLoaderUrl,
        workletUrl,
        onProgress = null,
      ) {
        try {
          if (onProgress) onProgress('Fetching WASM binary...')
          const wasmBinary = await fetch(wasmUrl).then((r) => {
            if (!r.ok)
              throw new Error(`WASM fetch failed: ${r.status} ${r.statusText}`)
            return r.arrayBuffer()
          })
          if (onProgress) onProgress('Fetching WASM loader...')
          const wasmLoaderCode = await fetch(wasmLoaderUrl).then((r) => {
            if (!r.ok)
              throw new Error(
                `WASM loader fetch failed: ${r.status} ${r.statusText}`,
              )
            return r.text()
          })
          if (onProgress) onProgress('Fetching worklet processor...')
          const workletProcessorCode = await fetch(workletUrl).then((r) => {
            if (!r.ok)
              throw new Error(
                `Worklet processor fetch failed: ${r.status} ${r.statusText}`,
              )
            return r.text()
          })
          if (onProgress) onProgress('Encoding WASM binary...')
          const wasmHex = arrayBufferToHex(wasmBinary)
          if (onProgress) onProgress('Creating worklet module...')
          const combinedCode = buildWorkletCode(
            wasmHex,
            wasmLoaderCode,
            workletProcessorCode,
          )
          const blob = new Blob([combinedCode], {
            type: 'application/javascript',
          })
          return URL.createObjectURL(blob)
        } catch (error) {
          throw new Error(
            `Failed to create AudioWorklet blob: ${error.message}`,
            { cause: error },
          )
        }
      }

      async function initialize() {
        try {
          updateStatus('Initializing AudioWorklet...', 'info')
          const AudioContext = window.AudioContext || window.webkitAudioContext
          audioContext = new AudioContext({ sampleRate: 48000 })
          const blobURL = await createAudioWorkletBlobWithWasm(
            '../../web/build/native-audio.wasm',
            '../../web/build/native-audio.js',
            'audio-worklet-processor.js',
            (status) => updateStatus(status, 'info'),
          )
          updateStatus('Registering AudioWorklet module...', 'info')
          await audioContext.audioWorklet.addModule(blobURL)
          audioWorkletNode = new AudioWorkletNode(
            audioContext,
            'audio-worklet-processor',
            {
              numberOfInputs: 0,
              numberOfOutputs: 1,
              outputChannelCount: [2],
            },
          )
          audioWorkletNode.port.onmessage = handleWorkletMessage
          audioWorkletNode.port.postMessage({ type: 'init' })
          URL.revokeObjectURL(blobURL)
        } catch (error) {
          updateStatus(`Failed to initialize: ${error.message}`, 'error')
          console.error('Initialization error:', error)
        }
      }

      function handleWorkletMessage(event) {
        const { type, data, error } = event.data
        switch (type) {
          case 'initialized':
            statusDiv.textContent = 'WASM module loaded successfully!'
            statusDiv.className = 'status success'
            btnTest.disabled = false
            btnPlay.disabled = false
            log('WASM module initialized')
            log(`\nAvailable constants: ${data.constants}`)
            log(`\nAvailable functions: ${data.functions}`)
            break
          case 'testComplete':
            log('\nOutput analysis:')
            log(`Peak amplitude (L): ${data.leftPeak.toFixed(4)}`)
            log(`Peak amplitude (R): ${data.rightPeak.toFixed(4)}`)
            log(
              `First ${data.arrayLength} samples (L): ${data.arrayLeft.join(', ')}`,
            )
            log(
              `First ${data.arrayLength} samples (R): ${data.arrayRight.join(', ')}`,
            )
            if (data.leftPeak > 0 || data.rightPeak > 0) {
              log('\n✅ Test completed successfully (signal detected)')
            } else {
              log('\n⚠️ Test completed (silence detected)')
            }
            break
          case 'engineSetup':
            log('\nEngine setup complete')
            log('\nPlaying...')
            break
          case 'cleanupComplete':
            log('\n✅ Playback completed')
            isPlaying = false
            btnTest.disabled = false
            btnPlay.disabled = false
            break
          case 'error':
            updateStatus(error, 'error')
            console.error(error)
            isPlaying = false
            btnTest.disabled = true
            btnPlay.disabled = true
            break
        }
      }

      function runTest() {
        outputDiv.textContent = ''
        log('Running test...')
        const sampleRate = 48000
        const numChannels = 2
        const bufferSize = 256
        log(
          `\nSetting up Engine...\nSample Rate: ${sampleRate} Hz\nChannels: ${numChannels}\nBuffer Size: ${bufferSize} samples`,
        )
        audioWorkletNode.port.postMessage({
          type: 'runTest',
          data: { sampleRate, numChannels, bufferSize },
        })
      }

      async function playTest() {
        if (isPlaying) {
          return
        }
        if (audioContext.state === 'suspended') {
          await audioContext.resume()
        }
        isPlaying = true
        btnTest.disabled = true
        btnPlay.disabled = true
        outputDiv.textContent = ''
        log(`Testing playback at ${audioContext.sampleRate} Hz...`)
        const sampleRate = audioContext.sampleRate
        const numChannels = 2
        const bufferSize = 128
        log(
          `\nSetting up Engine...\nSample Rate: ${sampleRate} Hz\nChannels: ${numChannels}\nBuffer Size: ${bufferSize} samples`,
        )
        audioWorkletNode.port.postMessage({
          type: 'setupEngine',
          data: { sampleRate, numChannels, bufferSize },
        })
        audioWorkletNode.connect(audioContext.destination)
        await new Promise((resolve) => setTimeout(resolve, 2000))
        log('\nStopping...')
        audioWorkletNode.disconnect()
        audioWorkletNode.port.postMessage({ type: 'cleanup' })
      }

      btnTest.addEventListener('click', runTest)
      btnPlay.addEventListener('click', playTest)

      initialize()
    </script>
  </body>
</html>

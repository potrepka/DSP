<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@potrepka/native-audio Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        margin: 10px 5px;
        cursor: pointer;
      }
      #output {
        margin-top: 20px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 5px;
        white-space: pre-wrap;
        font-family: monospace;
      }
      .status {
        margin: 10px 0;
        padding: 10px;
        border-radius: 5px;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
    </style>
  </head>
  <body>
    <h1>@potrepka/native-audio Test</h1>

    <div id="status" class="status info">Loading WASM module...</div>

    <div>
      <button id="btnTest" disabled>Run Test</button>
      <button id="btnPlay" disabled>Start Engine & Play</button>
    </div>

    <div id="output"></div>

    <!-- Load WASM module -->
    <script src="../web/build/native-audio.js"></script>

    <script>
      const statusDiv = document.getElementById('status')
      const outputDiv = document.getElementById('output')
      const btnTest = document.getElementById('btnTest')
      const btnPlay = document.getElementById('btnPlay')

      let Module
      let isPlaying = false

      // Initialize WASM module
      async function initialize() {
        try {
          statusDiv.textContent = 'Initializing WASM module...'
          statusDiv.className = 'status info'

          Module = await createAudioModule()
          window.Module = Module

          statusDiv.textContent = 'WASM module loaded successfully!'
          statusDiv.className = 'status success'

          btnTest.disabled = false
          btnPlay.disabled = false

          log('WASM module initialized')

          log(
            `\n${Object.entries(Module)
              .sort(([keyA], [keyB]) => keyA.localeCompare(keyB))
              .filter(([key, value]) => typeof value === 'boolean')
              .map(([key, value]) => `${key} = ${value}`)
              .join(', ')}`,
          )
          log(
            `\nAvailable constants: ${Object.entries(Module)
              .sort(([keyA], [keyB]) => keyA.localeCompare(keyB))
              .filter(([key, value]) => typeof value === 'number')
              .map(([key]) => key)
              .join(', ')}`,
          )
          log(
            `\nAvailable functions: ${Object.entries(Module)
              .sort(([keyA], [keyB]) => keyA.localeCompare(keyB))
              .filter(([key, value]) => typeof value === 'function')
              .map(([key]) => key)
              .join(', ')}`,
          )
        } catch (error) {
          statusDiv.textContent = 'Failed to load WASM module: ' + error.message
          statusDiv.className = 'status error'
          console.error(error)
        }
      }

      function log(message) {
        outputDiv.textContent += message + '\n'
      }

      function setupEngine(
        sampleRate = 44100,
        numChannels = 2,
        bufferSize = 512,
      ) {
        log(
          `\nSetting up Engine...\nSample Rate: ${sampleRate} Hz\nChannels: ${numChannels}\nBuffer Size: ${bufferSize} samples`,
        )
        const nodeProcessor = new Module.NodeProcessor(
          0,
          2,
          bufferSize,
          sampleRate,
        )

        const phasor = new Module.Phasor()
        const osc = new Module.TableOscillator(Module.Type.RATIO)
        const filter = new Module.Biquad()
        const gain = new Module.Multiplication(
          Module.Type.RATIO,
          Module.Space.TIME,
        )

        phasor.setNumChannels(numChannels)
        osc.setNumChannels(numChannels)
        filter.setNumChannels(numChannels)
        gain.setNumChannels(numChannels)

        const root = nodeProcessor.getDefaultNode()
        root.addChild(phasor)
        root.addChild(osc)
        root.addChild(filter)
        root.addChild(gain)

        phasor.getFrequency().setAllChannelValues(55)
        filter.getFrequency().setAllChannelValues(880)
        filter.getMode().setAllChannelValues(Module.BIQUAD_MODE_LOWPASS)
        gain.getFactor().setAllChannelValues(0.5)

        const sawtoothBufferSize = 2048
        const sawtooth = new Module.Buffer(
          Module.Type.RATIO,
          Module.Space.TIME,
          0,
          0,
          numChannels,
          sawtoothBufferSize,
        )
        const wrapper = sawtooth.getWrapper()
        for (let c = 0; c < numChannels; c++) {
          for (let s = 0; s < sawtoothBufferSize; s++) {
            const phase = s / sawtoothBufferSize
            const value = 2 * ((phase + 0.5) % 1) - 1
            wrapper.setSample(c, s, value)
          }
        }
        osc.getTables().push_back(sawtooth)

        phasor.getOutput().connect(osc.getPhase())
        osc.getOutput().connect(filter.getInput())
        filter.getOutput().connect(gain.getInput())
        gain.getOutput().connect(nodeProcessor.getAudioOutput())

        log('\nEngine setup complete')

        return {
          nodeProcessor,
          phasor,
          osc,
          filter,
          gain,
          sawtooth,
        }
      }

      function runTest() {
        outputDiv.textContent = ''
        log('Running test...')

        try {
          const sampleRate = 48000
          const numChannels = 2
          const bufferSize = 256

          const { nodeProcessor, phasor, osc, filter, gain, sawtooth } =
            setupEngine(sampleRate, numChannels, bufferSize)

          const audioBuffer = new Module.Data(numChannels, bufferSize)
          const midiBuffer = new Module.MidiBuffer()

          nodeProcessor.process(audioBuffer, midiBuffer)

          const left = audioBuffer.getReadChannelData(0)
          const right = audioBuffer.getReadChannelData(1)

          log('\nOutput analysis:')

          let leftPeak = 0
          let rightPeak = 0
          for (let i = 0; i < bufferSize; i++) {
            const leftAmplitude = Math.abs(left[i])
            const rightAmplitude = Math.abs(right[i])
            if (leftAmplitude > leftPeak) {
              leftPeak = leftAmplitude
            }
            if (rightAmplitude > rightPeak) {
              rightPeak = rightAmplitude
            }
          }

          log(`Peak amplitude (L): ${leftPeak.toFixed(4)}`)
          log(`Peak amplitude (R): ${rightPeak.toFixed(4)}`)

          const arrayLength = 8
          const precision = 4

          const arrayLeft = []
          for (let i = 0; i < arrayLength; i++) {
            arrayLeft.push(left[i].toFixed(precision))
          }
          const arrayRight = []
          for (let i = 0; i < arrayLength; i++) {
            arrayRight.push(right[i].toFixed(precision))
          }

          log(`First ${arrayLength} samples (L): ${arrayLeft.join(', ')}`)
          log(`First ${arrayLength} samples (R): ${arrayRight.join(', ')}`)

          nodeProcessor.delete()
          phasor.delete()
          osc.delete()
          filter.delete()
          gain.delete()
          sawtooth.delete()
          audioBuffer.delete()
          midiBuffer.delete()

          if (leftPeak > 0 || rightPeak > 0) {
            log('\n✅ Test completed successfully (signal detected)')
          } else {
            log('\n⚠️ Test completed (silence detected)')
          }
        } catch (error) {
          log('\n❌ Test failed: ' + error.message)
          console.error(error)
        }
      }

      async function playTest() {
        if (isPlaying) {
          return
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext
        const ctx = new AudioContext({
          sampleRate: 48000,
        })

        if (ctx.state === 'suspended') {
          await ctx.resume()
        }

        isPlaying = true
        btnTest.disabled = true
        btnPlay.disabled = true
        outputDiv.textContent = ''
        log(`Testing playback at ${ctx.sampleRate} Hz...`)

        try {
          const sampleRate = ctx.sampleRate
          const numChannels = 2
          const bufferSize = 256

          const { nodeProcessor, phasor, osc, filter, gain, sawtooth } =
            setupEngine(sampleRate, numChannels, bufferSize)

          const scriptNode = ctx.createScriptProcessor(bufferSize, 0, 2)

          const audioBuffer = new Module.Data(numChannels, bufferSize)
          const midiBuffer = new Module.MidiBuffer()

          scriptNode.onaudioprocess = (audioProcessingEvent) => {
            nodeProcessor.process(audioBuffer, midiBuffer)

            const outputBuffer = audioProcessingEvent.outputBuffer

            const left = audioBuffer.getReadChannelData(0)
            const right = audioBuffer.getReadChannelData(1)

            outputBuffer.copyToChannel(new Float32Array(left), 0)
            outputBuffer.copyToChannel(new Float32Array(right), 1)
          }

          scriptNode.connect(ctx.destination)

          log('\nPlaying...')

          await new Promise((resolve) => setTimeout(resolve, 2000))

          log('\nStopping...')

          scriptNode.disconnect()
          scriptNode.onaudioprocess = null
          ctx.close()

          nodeProcessor.delete()
          phasor.delete()
          osc.delete()
          filter.delete()
          gain.delete()
          sawtooth.delete()
          audioBuffer.delete()
          midiBuffer.delete()

          log('\n✅ Playback completed')
        } catch (error) {
          log('\n❌ Playback failed: ' + error.message)
          console.error(error)
        } finally {
          isPlaying = false
          btnTest.disabled = false
          btnPlay.disabled = false
        }
      }

      btnTest.addEventListener('click', runTest)
      btnPlay.addEventListener('click', playTest)

      initialize()
    </script>
  </body>
</html>
